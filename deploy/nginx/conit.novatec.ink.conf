# =============================================================================
# CONIT SUPPORT — Proxy inverso para conit.novatec.ink
# -----------------------------------------------------------------------------
# Copiar a  /etc/nginx/sites-available/conit.novatec.ink  y enlazar en
# sites-enabled. El bloque TLS lo completa certbot; ver DEPLOY.md.
#
# El panel y la API comparten dominio a proposito:
#
#   /api/     -> NestJS  (127.0.0.1:4000)
#   /uploads/ -> NestJS  (fotos de perfil, servidas como estaticos)
#   /health   -> NestJS  (queda fuera del prefijo de la API)
#   /         -> Next.js (127.0.0.1:3000)
#
# Compartir origen hace que las cookies de sesion sean de primera parte. Con
# dominios separados harian falta cookies entre sitios, que Safari y los
# bloqueadores restringen cada vez mas.
# =============================================================================

# Redireccion a HTTPS. Certbot anade la suya, pero se deja explicita para que
# el fichero funcione aunque se regenere el certificado desde cero.
server {
    listen 80;
    listen [::]:80;
    server_name conit.novatec.ink;

    # Validacion de certificados: debe resolverse por HTTP, sin redirigir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name conit.novatec.ink;

    # --- Certificado (lo rellena certbot) ------------------------------------
    ssl_certificate     /etc/letsencrypt/live/conit.novatec.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conit.novatec.ink/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Cabeceras de seguridad ----------------------------------------------
    # El resto (CSP, X-Frame-Options, etc.) los emite Helmet desde la API y
    # Next.js desde el panel; aqui solo va lo que depende del servidor web.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # El video de la intro pesa ~4,7 MB; las subidas nunca superan eso.
    client_max_body_size 12m;

    # --- API ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esta cabecera la API marcaria las cookies como inseguras y el
        # navegador las rechazaria al venir por HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # La exportacion de reportes puede tardar en periodos largos.
        proxy_read_timeout 120s;
    }

    # --- Ficheros subidos -----------------------------------------------------
    # Las fotos de perfil las sirve la API, no Next. Sin esta regla caerian en
    # el `location /` y devolverian el 404 del panel.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # El nombre del fichero lleva bytes aleatorios y no se reutiliza al
        # cambiar de foto, asi que se puede cachear con tranquilidad.
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Sonda de salud -------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Panel y sitio publico ------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para el refresco en caliente y para cualquier stream.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Los estaticos de Next llevan hash en el nombre: se pueden cachear para
    # siempre sin riesgo de servir una version vieja.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
